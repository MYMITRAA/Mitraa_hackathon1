spring:
  datasource:
    url: jdbc:h2:mem:mitraa_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop

  mail:
    host: localhost
    port: 2525
    username:
    password:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false

app:
  bootstrap-admin:
    enabled: false

  notifications:
    from-email: test@mitraa.local
    dispatch-ms: 3600000
