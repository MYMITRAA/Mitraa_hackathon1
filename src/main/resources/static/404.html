<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 — Page Not Found | MiTRAA Hackathons</title>
    <link rel="stylesheet" href="/404.css">
</head>
<body>
    <main class="error-page" aria-labelledby="error-title">
        <section class="error-card">
            <div class="error-code" aria-hidden="true">404</div>
            <p class="eyebrow">PAGE NOT FOUND</p>
            <h1 id="error-title">This page doesn't exist.</h1>
            <p class="message">
                The link you followed may be broken, or the address may have been entered incorrectly.
            </p>
            <button type="button" class="back-button" onclick="window.history.back()">
                Go Back
            </button>
        </section>
    </main>
</body>
</html>
