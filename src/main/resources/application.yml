spring:
  application:
    name: mitraa-hackathons

  profiles:
    default: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: sk.litonn79@gmail.com
    password: "geud sjua tsux qclt"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

  sso:
    enabled: ${SSO_ENABLED:false}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    github-client-id: ${GITHUB_CLIENT_ID:}
    github-client-secret: ${GITHUB_CLIENT_SECRET:}

  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      bucket-retention: 1h
      policies:
        - path: /api/auth/login
          capacity: 5
          refill-period: 1m

        - path: /api/auth/register
          capacity: 3
          refill-period: 10m

        - path: /api/auth/resend-otp
          capacity: 3
          refill-period: 10m

        - path: /api/auth/verify-email
          capacity: 10
          refill-period: 10m

        - path: /api/auth/forgot-password
          capacity: 3
          refill-period: 15m

        - path: /api/auth/reset-password
          capacity: 5
          refill-period: 15m

        - path: /api/auth/change-password
          capacity: 5
          refill-period: 15m

  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  notifications:
    from-email: sk.litonn79@gmail.com
    dispatch-ms: 3000